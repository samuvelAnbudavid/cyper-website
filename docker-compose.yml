version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: sam-company-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sam_company
      POSTGRES_USER: sam_company
      POSTGRES_PASSWORD: sam_company
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sam_company -d sam_company"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
